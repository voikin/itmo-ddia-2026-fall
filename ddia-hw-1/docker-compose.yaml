name: ddia-hw-1

x-require-secrets: ${GRAFANA_ADMIN_PASSWORD:?Run cp .env.example .env and python3 scripts/configure.py first}

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-app: &app
  <<: *hardening
  build:
    context: .
    target: app
  image: ddia-hw-1/app:local
  mem_limit: 256m
  cpus: 0.5
  read_only: true
  healthcheck:
    test: ["CMD", "/server", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 12
  restart: unless-stopped

x-app-env: &app-env
  HTTP_ADDR: ":8080"
  DEPLOYMENT: ${APP_DEPLOYMENT:?Run cp .env.example .env and python3 scripts/configure.py first}
  FAULT_BASE_LATENCY: 25ms
  FAULT_JITTER: 10ms
  FAULT_TAIL_EXTRA: 900ms

x-dc1-env: &dc1-env
  <<: *app-env
  DATACENTER: dc-1
  FAULT_TAIL_EVERY: 50
  FAULT_ERROR_EVERY: 20

x-dc2-env: &dc2-env
  <<: *app-env
  DATACENTER: dc-2
  FAULT_TAIL_EVERY: 10
  FAULT_ERROR_EVERY: 10

x-app-healthy: &app-healthy
  app-dc1-1: {condition: service_healthy}
  app-dc1-2: {condition: service_healthy}
  app-dc1-3: {condition: service_healthy}
  app-dc2-1: {condition: service_healthy}
  app-dc2-2: {condition: service_healthy}

services:
  app-dc1-1:
    <<: *app
    environment: {<<: *dc1-env, POD: pod-1}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
  app-dc1-2:
    <<: *app
    environment: {<<: *dc1-env, POD: pod-2}
  app-dc1-3:
    <<: *app
    environment: {<<: *dc1-env, POD: pod-3}
  app-dc2-1:
    <<: *app
    environment: {<<: *dc2-env, POD: pod-4}
  app-dc2-2:
    <<: *app
    environment: {<<: *dc2-env, POD: pod-5}

  victoriametrics:
    <<: *hardening
    image: victoriametrics/victoria-metrics:v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd
    command:
      - -promscrape.config=/etc/victoriametrics/scrape.yml
      - -storageDataPath=/storage
      - -retentionPeriod=2d
      - -search.latencyOffset=10s
      - -httpListenAddr=:8428
    volumes:
      - ./deploy/victoriametrics:/etc/victoriametrics:ro
      - victoriametrics-data:/storage
    ports:
      - "127.0.0.1:8428:8428"
    mem_limit: 1g
    cpus: 1.0
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  grafana:
    <<: *hardening
    image: grafana/grafana:12.2.10@sha256:d2ac2dae86601550e941f7e1c0b4b7e1f21fadebfa5956ba06fe0b3a64de7cf4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  grafana-token:
    <<: *hardening
    build:
      context: .
      target: tools
    image: ddia-hw-1/tools:local
    entrypoint: ["/grafana-token"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      GRAFANA_SA_NAME: dashgen
      GRAFANA_TOKEN_FILE: /var/lib/grafana-token/token
    secrets: [grafana_admin_password]
    volumes:
      - grafana-token:/var/lib/grafana-token
    depends_on:
      grafana:
        condition: service_healthy
    restart: "no"

  dashgen:
    <<: *hardening
    image: ddia-hw-1/tools:local
    entrypoint: ["/dashgen"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_TOKEN_FILE: /var/lib/grafana-token/token
      APP_URL: http://app-dc1-1:8080
      DEPLOYMENT: ${APP_DEPLOYMENT:?Run cp .env.example .env and python3 scripts/configure.py first}
      DATASOURCE_UID: victoriametrics
      FOLDER_UID: generated
      FOLDER_TITLE: Generated
    volumes:
      - grafana-token:/var/lib/grafana-token:ro
    read_only: true
    depends_on:
      <<: *app-healthy
      grafana-token:
        condition: service_completed_successfully
    restart: "no"

  k6:
    <<: *hardening
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    command: ["run", "--quiet", "/scripts/load.js"]
    environment:
      TARGETS: http://app-dc1-1:8080,http://app-dc1-2:8080,http://app-dc1-3:8080,http://app-dc2-1:8080,http://app-dc2-2:8080
      RATE: ${LOAD_RATE:-50}
      RAMP: ${LOAD_RAMP:-60s}
      HOLD: ${LOAD_HOLD:-30m}
      VUS: ${LOAD_VUS:-100}
      SEED_ITEMS: ${LOAD_SEED_ITEMS:-20}
    volumes:
      - ./deploy/k6:/scripts:ro
    mem_limit: 768m
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      <<: *app-healthy
      dashgen:
        condition: service_completed_successfully
    restart: "no"

secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

volumes:
  victoriametrics-data:
  grafana-data:
  grafana-token:
