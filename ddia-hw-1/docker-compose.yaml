name: ddia-hw-1

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ddia-hw-1/app:local
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_ADDR: ${APP_HTTP_ADDR:-:8080}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
